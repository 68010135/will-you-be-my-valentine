<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Will you be my Valentine?</title>

<style>
    body{
        text-align:center;
        font-family:Arial;
        background:#ffe6f0;
        margin-top:100px;
    }

    h1{
        font-size:40px;
    }

    button{
        font-size:20px;
        padding:15px 25px;
        margin:10px;
        border:none;
        border-radius:20px;
        cursor:pointer;
        position:absolute;
    }

    #yes{
        background:#ff4d88;
        color:white;
        left:45%;
        top:60%;
    }

    #no{
        background:#cccccc;
        left:55%;
        top:60%;
    }
</style>
</head>

<body>

<h1>Will you be my Valentine? 💖</h1>

<button id="yes" onclick="accepted()">Yes 💕</button>
<button id="no" onmouseover="moveNo()">No 😝</button>

<script>
function accepted(){
    document.body.innerHTML =
        "<h1>Yay!!! I love you ❤️</h1>";
}

function moveNo(){
    var btn = document.getElementById("no");
    var x = Math.random()*80;
    var y = Math.random()*80;
    btn.style.left = x + "%";
    btn.style.top = y + "%";
}
</script>

</body>
</html>
